<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes App</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const Search = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>;
    const Plus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>;
    const Folder = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>;
    const Moon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>;
    const Sun = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
    const Trash2 = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg>;
    const Edit3 = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>;
    const Save = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
    const X = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>;
    const FolderPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" x2="12" y1="11" y2="17"></line><line x1="9" x2="15" y1="14" y2="14"></line></svg>;
    const Bold = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"></path></svg>;
    const Italic = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" x2="10" y1="4" y2="4"></line><line x1="14" x2="5" y1="20" y2="20"></line><line x1="15" x2="9" y1="4" y2="20"></line></svg>;
    const Underline = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"></path><line x1="4" x2="20" y1="20" y2="20"></line></svg>;
    const List = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" x2="21" y1="6" y2="6"></line><line x1="8" x2="21" y1="12" y2="12"></line><line x1="8" x2="21" y1="18" y2="18"></line><line x1="3" x2="3.01" y1="6" y2="6"></line><line x1="3" x2="3.01" y1="12" y2="12"></line><line x1="3" x2="3.01" y1="18" y2="18"></line></svg>;
    const ListOrdered = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="10" x2="21" y1="6" y2="6"></line><line x1="10" x2="21" y1="12" y2="12"></line><line x1="10" x2="21" y1="18" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>;
    const Smile = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" x2="9.01" y1="9" y2="9"></line><line x1="15" x2="15.01" y1="9" y2="9"></line></svg>;

    function NoteTakingApp() {
      const [notes, setNotes] = useState(() => {
        const saved = localStorage.getItem('notes');
        return saved ? JSON.parse(saved) : [];
      });
      const [folders, setFolders] = useState(() => {
        const saved = localStorage.getItem('folders');
        return saved ? JSON.parse(saved) : ['Personal', 'Work', 'Ideas'];
      });
      const [activeFolder, setActiveFolder] = useState('All Notes');
      const [selectedNote, setSelectedNote] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('darkMode');
        return saved === 'true';
      });
      const [isEditing, setIsEditing] = useState(false);
      const [editedTitle, setEditedTitle] = useState('');
      const [editedContent, setEditedContent] = useState('');
      const [showNewFolderInput, setShowNewFolderInput] = useState(false);
      const [newFolderName, setNewFolderName] = useState('');
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const editorRef = useRef(null);

      const emojis = [
        '😀', '😃', '😄', '😁', '😅', '😂', '🤣', '😊', '😇', '🙂',
        '😉', '😌', '😍', '🥰', '😘', '😗', '😙', '😚', '😋', '😛',
        '😝', '😜', '🤪', '🤨', '🧐', '🤓', '😎', '🤩', '🥳', '😏',
        '😒', '😞', '😔', '😟', '😕', '🙁', '☹️', '😣', '😖', '😫',
        '😩', '🥺', '😢', '😭', '😤', '😠', '😡', '🤬', '🤯', '😳',
        '🥵', '🥶', '😱', '😨', '😰', '😥', '😓', '🤗', '🤔', '🤭',
        '🤫', '🤥', '😶', '😐', '😑', '😬', '🙄', '😯', '😦', '😧',
        '👍', '👎', '👏', '🙌', '🤝', '🙏', '💪', '✨', '⭐', '🌟',
        '💡', '💯', '🔥', '❤️', '💙', '💚', '💛', '🧡', '💜', '🖤',
        '✅', '❌', '⚠️', '📌', '📍', '🎯', '🎉', '🎊', '🎈', '🎁'
      ];

      useEffect(() => {
        localStorage.setItem('notes', JSON.stringify(notes));
      }, [notes]);

      useEffect(() => {
        localStorage.setItem('folders', JSON.stringify(folders));
      }, [folders]);

      useEffect(() => {
        localStorage.setItem('darkMode', darkMode);
      }, [darkMode]);

      const createNote = () => {
        const newNote = {
          id: Date.now(),
          title: 'Untitled Note',
          content: '',
          folder: activeFolder === 'All Notes' ? 'Personal' : activeFolder,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        setNotes([newNote, ...notes]);
        setSelectedNote(newNote);
        setIsEditing(true);
        setEditedTitle(newNote.title);
        setEditedContent(newNote.content);
      };

      const deleteNote = (id) => {
        setNotes(notes.filter(n => n.id !== id));
        if (selectedNote?.id === id) setSelectedNote(null);
      };

      const startEdit = () => {
        setIsEditing(true);
        setEditedTitle(selectedNote.title);
        setEditedContent(selectedNote.content);
      };

      const saveEdit = () => {
        setNotes(notes.map(n => 
          n.id === selectedNote.id 
            ? { ...n, title: editedTitle, content: editedContent, updatedAt: new Date().toISOString() }
            : n
        ));
        setSelectedNote({ ...selectedNote, title: editedTitle, content: editedContent });
        setIsEditing(false);
      };

      const cancelEdit = () => {
        setIsEditing(false);
        setEditedTitle(selectedNote.title);
        setEditedContent(selectedNote.content);
      };

      const addFolder = () => {
        if (newFolderName.trim() && !folders.includes(newFolderName.trim())) {
          setFolders([...folders, newFolderName.trim()]);
          setNewFolderName('');
          setShowNewFolderInput(false);
        }
      };

      const applyFormat = (command, value = null) => {
        document.execCommand(command, false, value);
        editorRef.current?.focus();
      };

      const insertEmoji = (emoji) => {
        const selection = window.getSelection();
        if (editorRef.current && editorRef.current.contains(selection.anchorNode)) {
          document.execCommand('insertText', false, emoji);
        } else {
          editorRef.current.focus();
          document.execCommand('insertText', false, emoji);
        }
        setShowEmojiPicker(false);
      };

      const handleContentChange = () => {
        if (editorRef.current) {
          setEditedContent(editorRef.current.innerHTML);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (e.shiftKey) {
            document.execCommand('insertLineBreak');
          } else {
            document.execCommand('insertParagraph');
          }
        }
      };

      const stripHtml = (html) => {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      };

      const filteredNotes = notes.filter(note => {
        const plainContent = stripHtml(note.content);
        const matchesSearch = note.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             plainContent.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesFolder = activeFolder === 'All Notes' || note.folder === activeFolder;
        return matchesSearch && matchesFolder;
      });

      const theme = darkMode ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-900';
      const cardBg = darkMode ? 'bg-gray-800' : 'bg-white';
      const borderColor = darkMode ? 'border-gray-700' : 'border-gray-200';
      const hoverBg = darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100';

      return (
        <div className={`min-h-screen ${theme} transition-colors duration-200`}>
          <div className="flex h-screen">
            <div className={`w-64 ${cardBg} border-r ${borderColor} flex flex-col`}>
              <div className={`p-4 border-b ${borderColor}`}>
                <h1 className="text-xl font-bold mb-4">My Notes</h1>
                <button onClick={createNote} className="w-full bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors">
                  <Plus />
                  New Note
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-2">
                <div className="mb-2">
                  <button onClick={() => setActiveFolder('All Notes')} className={`w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 transition-colors ${activeFolder === 'All Notes' ? 'bg-blue-600 text-white' : hoverBg}`}>
                    <Folder />
                    All Notes
                  </button>
                </div>

                <div className="mb-2">
                  <div className="flex items-center justify-between px-3 py-2 text-sm font-semibold opacity-60">
                    <span>Folders</span>
                    <button onClick={() => setShowNewFolderInput(!showNewFolderInput)} className={`${hoverBg} p-1 rounded`}>
                      <FolderPlus />
                    </button>
                  </div>
                  
                  {showNewFolderInput && (
                    <div className="px-3 pb-2">
                      <input type="text" value={newFolderName} onChange={(e) => setNewFolderName(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addFolder()} placeholder="Folder name" className={`w-full px-2 py-1 text-sm rounded border ${borderColor} ${cardBg}`} autoFocus />
                    </div>
                  )}

                  {folders.map(folder => (
                    <button key={folder} onClick={() => setActiveFolder(folder)} className={`w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 transition-colors ${activeFolder === folder ? 'bg-blue-600 text-white' : hoverBg}`}>
                      <Folder />
                      {folder}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`p-4 border-t ${borderColor}`}>
                <button onClick={() => setDarkMode(!darkMode)} className={`w-full px-4 py-2 rounded-lg flex items-center justify-center gap-2 ${hoverBg}`}>
                  {darkMode ? <Sun /> : <Moon />}
                  {darkMode ? 'Light Mode' : 'Dark Mode'}
                </button>
              </div>
            </div>

            <div className={`w-80 ${cardBg} border-r ${borderColor} flex flex-col`}>
              <div className={`p-4 border-b ${borderColor}`}>
                <div className={`flex items-center gap-2 px-3 py-2 rounded-lg border ${borderColor}`}>
                  <Search />
                  <input type="text" placeholder="Search notes..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="flex-1 bg-transparent outline-none" />
                </div>
              </div>

              <div className="flex-1 overflow-y-auto">
                {filteredNotes.length === 0 ? (
                  <div className="p-8 text-center opacity-50">
                    <p>No notes yet. Create your first note!</p>
                  </div>
                ) : (
                  filteredNotes.map(note => (
                    <div key={note.id} onClick={() => { setSelectedNote(note); setIsEditing(false); }} className={`p-4 border-b ${borderColor} cursor-pointer transition-colors ${selectedNote?.id === note.id ? 'bg-blue-50 dark:bg-blue-900/20' : hoverBg}`}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex-1 min-w-0">
                          <h3 className="font-semibold truncate">{note.title}</h3>
                          <p className="text-sm opacity-60 truncate mt-1">{stripHtml(note.content) || 'No content'}</p>
                          <div className="flex items-center gap-2 mt-2 text-xs opacity-40">
                            <span>{note.folder}</span>
                            <span>•</span>
                            <span>{new Date(note.updatedAt).toLocaleDateString()}</span>
                          </div>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); deleteNote(note.id); }} className="opacity-0 hover:opacity-100 transition-opacity p-1 hover:text-red-600">
                          <Trash2 />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="flex-1 flex flex-col">
              {selectedNote ? (
                <>
                  <div className={`p-4 border-b ${borderColor} flex items-center justify-between`}>
                    <div className="flex items-center gap-2">
                      <select value={selectedNote.folder} onChange={(e) => { const newFolder = e.target.value; setNotes(notes.map(n => n.id === selectedNote.id ? { ...n, folder: newFolder } : n)); setSelectedNote({ ...selectedNote, folder: newFolder }); }} className={`px-3 py-1 rounded border ${borderColor} ${cardBg}`} disabled={isEditing}>
                        {folders.map(f => (
                          <option key={f} value={f}>{f}</option>
                        ))}
                      </select>
                      <span className="text-sm opacity-40">
                        Last edited {new Date(selectedNote.updatedAt).toLocaleString()}
                      </span>
                    </div>
                    {isEditing ? (
                      <div className="flex gap-2">
                        <button onClick={saveEdit} className="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2 hover:bg-blue-700">
                          <Save />
                          Save
                        </button>
                        <button onClick={cancelEdit} className={`px-4 py-2 rounded-lg flex items-center gap-2 ${hoverBg}`}>
                          <X />
                          Cancel
                        </button>
                      </div>
                    ) : (
                      <button onClick={startEdit} className={`px-4 py-2 rounded-lg flex items-center gap-2 ${hoverBg}`}>
                        <Edit3 />
                        Edit
                      </button>
                    )}
                  </div>

                  {isEditing && (
                    <div className={`p-2 border-b ${borderColor} flex items-center gap-1 flex-wrap`}>
                      <button onClick={() => applyFormat('bold')} className={`p-2 rounded ${hoverBg} transition-colors`} title="Bold (Ctrl+B)">
                        <Bold />
                      </button>
                      <button onClick={() => applyFormat('italic')} className={`p-2 rounded ${hoverBg} transition-colors`} title="Italic (Ctrl+I)">
                        <Italic />
                      </button>
                      <button onClick={() => applyFormat('underline')} className={`p-2 rounded ${hoverBg} transition-colors`} title="Underline (Ctrl+U)">
                        <Underline />
                      </button>
                      <div className={`w-px h-6 ${borderColor} bg-current opacity-20 mx-1`} />
                      <button onClick={() => applyFormat('insertUnorderedList')} className={`p-2 rounded ${hoverBg} transition-colors`} title="Bullet List">
                        <List />
                      </button>
                      <button onClick={() => applyFormat('insertOrderedList')} className={`p-2 rounded ${hoverBg} transition-colors`} title="Numbered List">
                        <ListOrdered />
                      </button>
                      <div className={`w-px h-6 ${borderColor} bg-current opacity-20 mx-1`} />
                      <select onChange={(e) => applyFormat('fontSize', e.target.value)} className={`px-2 py-1 rounded border ${borderColor} ${cardBg} text-sm`} defaultValue="3">
                        <option value="1">Small</option>
                        <option value="3">Normal</option>
                        <option value="5">Large</option>
                        <option value="7">Huge</option>
                      </select>
                      <div className={`w-px h-6 ${borderColor} bg-current opacity-20 mx-1`} />
                      <div className="relative">
                        <button onClick={() => setShowEmojiPicker(!showEmojiPicker)} className={`p-2 rounded ${hoverBg} transition-colors`} title="Insert Emoji">
                          <Smile />
                        </button>
                        {showEmojiPicker && (
                          <div className={`absolute top-full left-0 mt-1 ${cardBg} border ${borderColor} rounded-lg shadow-lg p-2 z-50 w-64 max-h-48 overflow-y-auto`}>
                            <div className="grid grid-cols-8 gap-1">
                              {emojis.map((emoji, i) => (
                                <button key={i} onClick={() => insertEmoji(emoji)} className={`text-2xl p-1 rounded ${hoverBg} transition-colors`}>
                                  {emoji}
                                </button>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  <div className="flex-1 overflow-y-auto p-8">
                    {isEditing ? (
                      <div className="max-w-4xl mx-auto">
                        <input type="text" value={editedTitle} onChange={(e) => setEditedTitle(e.target.value)} className={`w-full text-3xl font-bold mb-4 bg-transparent border-b-2 ${borderColor} pb-2 outline-none`} placeholder="Note title..." />
                        <div ref={editorRef} contentEditable onInput={handleContentChange} onKeyDown={handleKeyDown} dangerouslySetInnerHTML={{ __html: editedContent }} className={`w-full min-h-96 bg-transparent outline-none`} suppressContentEditableWarning />
                      </div>
                    ) : (
                      <div className="max-w-4xl mx-auto">
                        <h1 className="text-3xl font-bold mb-6">{selectedNote.title}</h1>
                        <div dangerouslySetInnerHTML={{ __html: selectedNote.content || '<p style="opacity: 0.5">No content yet. Click Edit to start writing.</p>' }} />
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <div className="flex-1 flex items-center justify-center opacity-50">
                  <div className="text-center">
                    <p className="text-xl mb-2">Select a note or create a new one</p>
                    <p className="text-sm">Your notes will be saved automatically</p>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NoteTakingApp />);
  </script>
</body>
</html>
